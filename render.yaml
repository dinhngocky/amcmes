services:
  - type: web
    name: amcvn-erp-test
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./postgres/Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh -c "npm run db:init && npm start"
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amcvn-erp-test-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: FILE_SIGNING_SECRET
        generateValue: true
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: DB_POOL_SIZE
        value: "5"

databases:
  - name: amcvn-erp-test-db
    databaseName: amcvn
    user: amcvn
    plan: free
    region: singapore
    postgresMajorVersion: "17"

